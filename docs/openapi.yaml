components:
  schemas:
    AdminPayout:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vendor:
          $ref: '#/components/schemas/VendorSummary'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        method:
          allOf:
          - $ref: '#/components/schemas/PayoutMethodEnum'
          readOnly: true
        reference:
          type: string
          readOnly: true
          description: External transfer id
        paid_at:
          type: string
          format: date-time
          readOnly: true
        recorded_by_name:
          type: string
        note:
          type: string
          readOnly: true
      required:
      - amount
      - id
      - method
      - note
      - paid_at
      - recorded_by_name
      - reference
      - vendor
    BankNameEnum:
      enum:
      - CRDB
      - NMB
      type: string
      description: |-
        * `CRDB` - CRDB
        * `NMB` - NMB
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name_en:
          type: string
          maxLength: 100
        name_sw:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - id
      - kind
      - name_en
      - name_sw
      - slug
    ChannelEnum:
      enum:
      - api
      - whatsapp
      type: string
      description: |-
        * `api` - API
        * `whatsapp` - WhatsApp
    Commission:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
          readOnly: true
          description: 0.1000 = 10%
        effective_from:
          type: string
          format: date-time
          readOnly: true
        set_by_name:
          type: string
          nullable: true
          description: null = system
      required:
      - effective_from
      - id
      - rate
    CommissionInputRequest:
      type: object
      properties:
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
          description: 0.1000 = 10%
      required:
      - rate
    CommissionPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        current_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
        results:
          type: array
          items:
            $ref: '#/components/schemas/Commission'
      required:
      - count
      - current_rate
      - next
      - previous
      - results
    DeclineRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason
    Earning:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order:
          type: string
          format: uuid
          readOnly: true
        order_reference:
          type: string
        channel:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          readOnly: true
        gross:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        commission_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
          readOnly: true
        commission_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        net:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        reversed:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - channel
      - commission_amount
      - commission_rate
      - created_at
      - gross
      - id
      - net
      - order
      - order_reference
      - reversed
    EarningPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        summary:
          $ref: '#/components/schemas/LedgerSummary'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Earning'
      required:
      - count
      - next
      - previous
      - results
      - summary
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        title:
          type: string
          maxLength: 150
        starts_at:
          type: string
          format: date-time
        venue:
          type: string
          maxLength: 255
        service_area:
          type: string
          format: uuid
          nullable: true
        guest_count:
          type: integer
          maximum: 2147483647
          minimum: 1
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_type
      - guest_count
      - id
      - starts_at
      - title
      - venue
    EventRequest:
      type: object
      properties:
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        title:
          type: string
          minLength: 1
          maxLength: 150
        starts_at:
          type: string
          format: date-time
        venue:
          type: string
          minLength: 1
          maxLength: 255
        service_area:
          type: string
          format: uuid
          nullable: true
        guest_count:
          type: integer
          maximum: 2147483647
          minimum: 1
        notes:
          type: string
      required:
      - event_type
      - guest_count
      - starts_at
      - title
      - venue
    EventTypeEnum:
      enum:
      - wedding
      - birthday
      - corporate
      - funeral
      - graduation
      - religious
      - other
      type: string
      description: |-
        * `wedding` - Wedding
        * `birthday` - Birthday
        * `corporate` - Corporate
        * `funeral` - Funeral
        * `graduation` - Graduation
        * `religious` - Religious
        * `other` - Other
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vendor:
          allOf:
          - $ref: '#/components/schemas/VendorSummary'
          readOnly: true
        category:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 150
        description:
          type: string
        kind:
          $ref: '#/components/schemas/KindEnum'
        is_alcoholic:
          type: boolean
          description: Required for drinks; must be false for food.
        unit:
          $ref: '#/components/schemas/UnitEnum'
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        min_quantity:
          type: integer
          maximum: 2147483647
          minimum: 1
        is_available:
          type: boolean
        image:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - id
      - kind
      - name
      - unit
      - unit_price
      - vendor
    ItemRequest:
      type: object
      properties:
        category:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        kind:
          $ref: '#/components/schemas/KindEnum'
        is_alcoholic:
          type: boolean
          description: Required for drinks; must be false for food.
        unit:
          $ref: '#/components/schemas/UnitEnum'
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        min_quantity:
          type: integer
          maximum: 2147483647
          minimum: 1
        is_available:
          type: boolean
        image:
          type: string
          format: binary
      required:
      - category
      - kind
      - name
      - unit
      - unit_price
    KindEnum:
      enum:
      - food
      - drink
      type: string
      description: |-
        * `food` - Food
        * `drink` - Drink
    LedgerSummary:
      type: object
      description: Reversed earnings are left out. `balance` = net_online - commission_owed_cash
        - payouts.
      properties:
        gross:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        commission:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        net_online:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        commission_owed_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        payouts:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        balance:
          type: string
          format: decimal
