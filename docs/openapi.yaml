          type: string
      required:
      - access
      - refresh
      - user
    RoleEnum:
      enum:
      - client
      - vendor
      - admin
      type: string
      description: |-
        * `client` - Client
        * `vendor` - Vendor
        * `admin` - Admin
    ServiceArea:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    ServiceAreaRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UnitEnum:
      enum:
      - plate
      - person
      - piece
      - bottle
      - crate
      - litre
      - kg
      - tray
      type: string
      description: |-
        * `plate` - Plate
        * `person` - Person
        * `piece` - Piece
        * `bottle` - Bottle
        * `crate` - Crate
        * `litre` - Litre
        * `kg` - Kg
        * `tray` - Tray
    User:
      type: object
      description: Own profile. Phone, role and channel are read-only.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          readOnly: true
          description: E.164
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        preferred_language:
          $ref: '#/components/schemas/PreferredLanguageEnum'
        created_via:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_via
      - full_name
      - id
      - phone
      - role
    VendorPayout:
      type: object
      description: What the vendor sees. Never add the admin's note or name here.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        method:
          allOf:
          - $ref: '#/components/schemas/PayoutMethodEnum'
          readOnly: true
        reference:
          type: string
          readOnly: true
          description: External transfer id
        paid_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - id
      - method
      - paid_at
      - reference
    VendorProfile:
      type: object
      description: The vendor's own profile (also returned to admins).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business_name:
          type: string
          maxLength: 150
        description:
          type: string
        contact_phone:
          type: string
          maxLength: 32
        status:
          allOf:
          - $ref: '#/components/schemas/VendorStatusEnum'
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        offers_food:
          type: boolean
        offers_drinks:
          type: boolean
        min_notice_days:
          type: integer
          maximum: 32767
          minimum: 0
        service_areas:
          type: array
          items:
            $ref: '#/components/schemas/ServiceArea'
          readOnly: true
        payout_method:
          oneOf:
          - $ref: '#/components/schemas/PayoutMethodEnum'
          - $ref: '#/components/schemas/BlankEnum'
        payout_account_name:
          type: string
          maxLength: 150
        payout_account_number:
          type: string
          maxLength: 50
        payout_provider:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_at
      - business_name
      - contact_phone
      - created_at
      - id
      - service_areas
      - status
    VendorRegisterRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          maxLength: 32
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 1
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/PreferredLanguageEnum'
          default: en
        business_name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          default: ''
        contact_phone:
          type: string
          minLength: 1
          maxLength: 32
        offers_food:
          type: boolean
          default: false
        offers_drinks:
          type: boolean
          default: false
        min_notice_days:
          type: integer
          maximum: 365
          minimum: 0
          default: 2
        service_area_ids:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
      required:
      - business_name
      - full_name
      - password
      - phone
      - service_area_ids
    VendorRegisterResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        vendor:
          $ref: '#/components/schemas/VendorProfile'
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
      - user
      - vendor
    VendorStatusEnum:
      enum:
      - pending
      - approved
      - suspended
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `suspended` - Suspended
        * `rejected` - Rejected
    VendorSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business_name:
          type: string
          maxLength: 150
      required:
      - business_name
      - id
    VendorSummaryRequest:
      type: object
      properties:
        business_name:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - business_name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
