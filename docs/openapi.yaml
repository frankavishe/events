openapi: 3.0.3
info:
  title: Event Catering & Drinks Marketplace API
  version: 1.0.0
  description: Backend API for booking food and drinks for events (Tanzania).
paths:
  /api/v1/admin/commission/:
    get:
      operationId: v1_admin_commission_list
      description: Current commission rate and its history.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPage'
          description: ''
    post:
      operationId: v1_admin_commission_create
      description: Set the rate for payments that succeed from now on.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommissionInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommissionInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commission'
          description: ''
  /api/v1/admin/payouts/:
    get:
      operationId: v1_admin_payouts_list
      description: Payouts to all vendors.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminPayoutList'
          description: ''
    post:
      operationId: v1_admin_payouts_create
      description: Record a transfer made outside the system. It cannot exceed the
        vendor's balance.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayoutInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayoutInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayout'
          description: ''
  /api/v1/admin/vendors/{id}/approve/:
    post:
      operationId: v1_admin_vendors_approve_create
      description: Approve a pending, rejected or suspended vendor.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfile'
          description: ''
  /api/v1/admin/vendors/{id}/balance/:
    get:
      operationId: v1_admin_vendors_balance_retrieve
      description: A vendor's totals and balance.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerSummary'
          description: ''
  /api/v1/admin/vendors/{id}/reject/:
    post:
      operationId: v1_admin_vendors_reject_create
      description: Reject a pending vendor.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfile'
          description: ''
  /api/v1/admin/vendors/{id}/suspend/:
    post:
      operationId: v1_admin_vendors_suspend_create
      description: Suspend an approved vendor; its catalog is hidden immediately.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfile'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Register a client account and return JWT tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/auth/register/vendor/:
    post:
      operationId: v1_auth_register_vendor_create
      description: Register a vendor (pending approval) and return JWT tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VendorRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VendorRegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorRegisterResponse'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: Log in with phone or email + password; returns `{access, refresh}`.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginTokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - drink
          - food
        description: |-
          * `food` - Food
          * `drink` - Drink
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
  /api/v1/events/:
    get:
      operationId: v1_events_list
      description: The authenticated client's own events.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
    post:
      operationId: v1_events_create
      description: The authenticated client's own events.
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/v1/events/{id}/:
    get:
      operationId: v1_events_retrieve
      description: The authenticated client's own events.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this event.
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    patch:
      operationId: v1_events_partial_update
      description: The authenticated client's own events.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this event.
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    delete:
      operationId: v1_events_destroy
      description: The authenticated client's own events.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this event.
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/items/:
    get:
      operationId: v1_items_list
      description: Available items from approved vendors.
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: is_alcoholic
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - drink
          - food
        description: |-
          * `food` - Food
          * `drink` - Drink
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: min_price
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: service_area
        schema:
          type: string
          format: uuid
      - in: query
        name: vendor
        schema:
          type: string
          format: uuid
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedItemList'
          description: ''
  /api/v1/items/{id}/:
    get:
      operationId: v1_items_retrieve
      description: Available items from approved vendors.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this item.
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      description: The authenticated user's own profile.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_me_partial_update
      description: The authenticated user's own profile.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/orders/:
    get:
      operationId: v1_orders_list
      description: Clients see their own orders, vendors the orders placed with them,
        admins all.
      parameters:
      - in: query
        name: event
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - awaiting_cash
          - cancelled
          - completed
          - confirmed
          - declined
          - expired
          - fulfilled
          - paid
          - pending
          - refunded
        description: |-
          * `pending` - Pending
          * `confirmed` - Confirmed
          * `declined` - Declined
          * `expired` - Expired
          * `cancelled` - Cancelled
          * `awaiting_cash` - Awaiting cash payment
          * `paid` - Paid
          * `fulfilled` - Fulfilled
          * `completed` - Completed
          * `refunded` - Refunded
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderListList'
          description: ''
    post:
      operationId: v1_orders_create
      description: Place an order with one vendor for one of your events.
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/:
    get:
      operationId: v1_orders_retrieve
      description: Clients see their own orders, vendors the orders placed with them,
        admins all.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this order.
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/cancel/:
    post:
      operationId: v1_orders_cancel_create
      description: Clients see their own orders, vendors the orders placed with them,
        admins all.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this order.
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/complete/:
    post:
      operationId: v1_orders_complete_create
      description: Only after the event date has passed.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this order.
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/confirm/:
    post:
      operationId: v1_orders_confirm_create
      description: Clients see their own orders, vendors the orders placed with them,
        admins all.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this order.
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/confirm-cash/:
    post:
      operationId: v1_orders_confirm_cash_create
      description: The order's vendor or an admin confirms that cash was received.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - payments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/decline/:
    post:
      operationId: v1_orders_decline_create
      description: Clients see their own orders, vendors the orders placed with them,
        admins all.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this order.
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeclineRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeclineRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/fulfil/:
    post:
      operationId: v1_orders_fulfil_create
      description: Clients see their own orders, vendors the orders placed with them,
        admins all.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this order.
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/pay/:
    post:
      operationId: v1_orders_pay_create
      description: Pay a confirmed order online (202, poll the payment) or choose
        cash (200).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayResponse'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayResponse'
          description: ''
  /api/v1/orders/{id}/refund/:
    post:
      operationId: v1_orders_refund_create
      description: Record a refund made outside the system; reverses the vendor's
        earning.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefundRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefundRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/packages/:
    get:
      operationId: v1_packages_list
      description: Available packages from approved vendors.
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: is_alcoholic
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - drink
          - food
        description: |-
          * `food` - Food
          * `drink` - Drink
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: min_price
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: service_area
        schema:
          type: string
          format: uuid
      - in: query
        name: vendor
        schema:
          type: string
          format: uuid
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
