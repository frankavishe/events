# Local development. Production needs config.settings.prod and real credentials (see README.md).
x-app: &app
  build: .
  image: events-backend
  env_file: .env
  environment: &app-env
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://events:events@db:5432/events
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    ports:
      # Host port 5435 avoids clashing with a locally installed PostgreSQL on 5432.
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    volumes:
      - media:/app/media
    depends_on: &app-deps
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: celery -A config worker -l info
    depends_on: *app-deps

  beat:
    <<: *app
    command: celery -A config beat -l info
    depends_on: *app-deps

volumes:
  pgdata:
  media:
